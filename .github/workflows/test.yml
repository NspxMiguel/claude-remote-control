name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The suite runs against a fake Claude Code executable, so it needs no
      # credentials and never reaches the network.
      - run: npm test

      - name: Icons are reproducible from source
        run: |
          npm run icons
          git diff --exit-code -- web/icons
