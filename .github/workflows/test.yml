name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The suite runs against a fake Claude Code executable, so it needs no
      # credentials and never reaches the network.
      # (The suite also checks the committed icons still match the generator,
      # comparing decoded pixels — zlib bytes differ across platforms.)
      - run: npm test
